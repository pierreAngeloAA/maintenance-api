name: CI

on:
  pull_request:
  # Solo main: las ramas de trabajo ya las cubre el trigger de pull_request,
  # y tenerlas en los dos hacia correr todo dos veces por push.
  push:
    branches: [ main ]

# Una corrida por rama: si llega un push nuevo, se cancela la anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: RSpec
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maintenance_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/maintenance_api_test

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Preparar base de datos
        run: bin/rails db:test:prepare

      - name: Correr RSpec
        run: bundle exec rspec

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  lint:
    name: RuboCop + Brakeman
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --parallel

      - name: Brakeman
        run: bundle exec brakeman --no-pager

      - name: Auditoria de gemas
        run: bundle exec bundle-audit check --update
