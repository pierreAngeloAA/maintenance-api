# Blueprint de Render para maintenance-api.
# Crear el servicio desde Render Dashboard -> New -> Blueprint apuntando a este repo.
services:
  - type: web
    name: maintenance-api
    runtime: ruby
    plan: free
    branch: main
    buildCommand: bundle install && bundle exec rails db:migrate
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: maintenance-db
          property: connectionString

databases:
  - name: maintenance-db
    plan: free
    databaseName: maintenance_production
    user: maintenance
