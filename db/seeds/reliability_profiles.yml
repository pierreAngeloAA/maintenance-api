- { part_code: serpentine_belt,    vehicle_type: car, weibull_shape: 3.0, characteristic_life: 60000, life_unit: km }
- { part_code: brake_pads,         vehicle_type: car, weibull_shape: 2.5, characteristic_life: 35000, life_unit: km }
- { part_code: tires,              vehicle_type: car, weibull_shape: 2.5, characteristic_life: 45000, life_unit: km }
