# Parametros de Weibull por pieza y clase de vehiculo.
#
# ADVERTENCIA: todos estos numeros son ESTIMACIONES DE INGENIERIA, no datos
# medidos. Salen de los intervalos recomendados de fabricante ajustados a uso
# urbano colombiano. Estan marcados con source: engineering_estimate justamente
# para poder reemplazarlos cuando haya volumen real de mantenimientos de usuarios,
# que es la ventaja competitiva del producto.
#
# Criterio usado para cada parametro:
#
# characteristic_life (eta): uso al que ya fallo el 63,2%. Se toma el intervalo
#   recomendado de fabricante y se ajusta un poco hacia arriba, porque el
#   intervalo recomendado es conservador: la pieza no falla exactamente ahi.
#
# weibull_shape (beta): forma de la curva, segun el modo de falla dominante.
#   beta ~ 1.0 - 1.5  falla aleatoria, sin desgaste acumulado (electronica, bombillos)
#   beta ~ 1.5 - 2.0  desgaste leve o mixto (guayas, cables)
#   beta ~ 2.0 - 3.0  desgaste progresivo tipico (llantas, pastillas, cadena)
#   beta > 3.0        fatiga con vida bien definida (correas, fluidos por degradacion)
#
# life_unit: km cuando la pieza se gasta rodando; months cuando se degrada con el
#   tiempo asi el vehiculo este quieto (bateria, liquido de frenos, refrigerante).

# ============ AUTOMOVIL ============
- { part_code: engine_oil,         vehicle_type: car, weibull_shape: 3.5, characteristic_life: 7000,  life_unit: km }
- { part_code: oil_filter,         vehicle_type: car, weibull_shape: 3.5, characteristic_life: 7000,  life_unit: km }
