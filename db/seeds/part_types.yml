# Catalogo base de tipos de pieza.
#
# - `code` es el identificador estable, en ingles: lo usa el codigo y no cambia.
# - `name` es lo que ve el usuario, en espanol: es contenido, no codigo.
# - `applicable_vehicle_types` dice que clases de vehiculo llevan la pieza.
#
# Para soportar una clase nueva de vehiculo se agregan filas aca, no codigo.

# --- Comunes a auto y moto ---
- code: engine_oil
  name: Aceite de motor
  category: fluids
  applicable_vehicle_types: [car, motorcycle]

